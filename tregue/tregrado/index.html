<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cubo</title>
    <style>
        html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const cena = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
        camera.position.z = 3.6;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Troque "imagem.jpg" pelo nome da sua imagem
        const textura = new THREE.TextureLoader().load("imagem.jpg");
        const cubo = new THREE.Mesh(
            new THREE.BoxGeometry(1.4, 1.4, 1.4),
            new THREE.MeshBasicMaterial({ map: textura })
        );
        cubo.rotation.x = 0.4;
        cena.add(cubo);

        function animar() {
            requestAnimationFrame(animar);
            cubo.rotation.y += 0.01; // velocidade da rotação
            cubo.rotation.x += 0.004; // deixa de lado também
            renderer.render(cena, camera);
        }
        animar();

        addEventListener("resize", () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
