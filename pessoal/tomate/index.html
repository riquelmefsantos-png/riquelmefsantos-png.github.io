<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tomatada</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #cena {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: crosshair;
  }
  #alvo {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  #btnLimpar {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    padding: 14px 28px;
    font-size: 18px;
    font-weight: 700;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: #fff;
    background: linear-gradient(180deg, #4aa3e0, #2a78b8);
    border: none;
    border-radius: 999px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    cursor: pointer;
    touch-action: manipulation;
  }
  #placar {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top));
    left: 12px;
    z-index: 10;
    padding: 10px 14px;
    color: #fff;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    background: rgba(0, 0, 0, 0.55);
    border-radius: 12px;
    pointer-events: none;
    backdrop-filter: blur(4px);
  }
  #placar b { font-variant-numeric: tabular-nums; }
  #btnLimpar:active { transform: translateX(-50%) scale(0.96); }
  #btnLimpar:disabled { opacity: 0.6; cursor: default; }
</style>
</head>
<body>

<div id="cena">
  <img id="alvo" src="imagem.jpg" alt="Imagem" draggable="false">
</div>
<canvas id="tela"></canvas>
<button id="btnLimpar" type="button">🧽 Limpar</button>
<div id="placar">
  <div>🍅 Você jogou: <b id="tomatesMeus">0</b></div>
  <div>🌎 Todos jogaram: <b id="tomatesTodos">…</b></div>
</div>


<script>
(function () {
  // Compatibilidade: navegadores antigos não têm roundRect
  if (window.CanvasRenderingContext2D && !CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
      r = Math.min(r || 0, w / 2, h / 2);
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
    };
  }

  const cena = document.getElementById('cena');
  const canvas = document.getElementById('tela');
  const ctx = canvas.getContext('2d');

  let W, H, dpr;
  function ajustar() {
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  ajustar();
  window.addEventListener('resize', ajustar);

  // Camada permanente com as manchas (acumulam na imagem)
  const manchas = document.createElement('canvas');
  const mctx = manchas.getContext('2d');
  // Camada de água (spray) que também é removida pelo rodo
  const agua = document.createElement('canvas');
  const actx = agua.getContext('2d');
  let fase = null; // null | 'spray' | 'rodo'
  function copiarCanvas(c) {
    const t = document.createElement('canvas');
    t.width = c.width;
    t.height = c.height;
    if (c.width && c.height) t.getContext('2d').drawImage(c, 0, 0);
    return t;
  }
  function ajustarManchas() {
    // guarda o conteúdo para não apagar as manchas quando a tela mudar de tamanho
    // (acontece no celular quando a barra do navegador some/aparece)
    const velhoM = copiarCanvas(manchas);
    const velhoA = copiarCanvas(agua);
    manchas.width = canvas.width;
    manchas.height = canvas.height;
    mctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    agua.width = canvas.width;
    agua.height = canvas.height;
    actx.setTransform(dpr, 0, 0, dpr, 0, 0);
    mctx.save(); mctx.setTransform(1, 0, 0, 1, 0, 0); mctx.drawImage(velhoM, 0, 0); mctx.restore();
    actx.save(); actx.setTransform(1, 0, 0, 1, 0, 0); actx.drawImage(velhoA, 0, 0); actx.restore();
  }
  ajustarManchas();
  window.addEventListener('resize', ajustarManchas);

  const voando = [];   // tomates no ar
  const gotas = [];    // respingos animados
  const escorrendo = []; // sucos escorrendo

  const rand = (a, b) => Math.random() * (b - a) + a;

  // ---------- Desenho do tomate ----------
  function desenharTomate(c, x, y, r, rot) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);

    // corpo
    const g = c.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r * 1.05);
    g.addColorStop(0, '#ff6b5a');
    g.addColorStop(0.45, '#e5261b');
    g.addColorStop(1, '#a30f0a');
    c.fillStyle = g;
    c.beginPath();
    c.ellipse(0, 0, r, r * 0.92, 0, 0, Math.PI * 2);
    c.fill();

    // brilho
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.beginPath();
    c.ellipse(-r * 0.35, -r * 0.4, r * 0.25, r * 0.14, -0.6, 0, Math.PI * 2);
    c.fill();

    // folhas
    c.fillStyle = '#2f8f2f';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * Math.PI * 2;
      c.save();
      c.rotate(a);
      c.beginPath();
      c.moveTo(0, -r * 0.8);
      c.quadraticCurveTo(r * 0.22, -r * 0.95, r * 0.05, -r * 0.55);
      c.quadraticCurveTo(-r * 0.05, -r * 0.7, 0, -r * 0.8);
      c.fill();
      c.restore();
    }
    // cabinho
    c.strokeStyle = '#1d5e1d';
    c.lineWidth = Math.max(2, r * 0.1);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -r * 0.8);
    c.lineTo(r * 0.05, -r * 1.0);
    c.stroke();

    c.restore();
  }

  // ---------- Mancha de tomate esmagado ----------
  function desenharMancha(c, x, y, tam) {
    // mancha principal
    c.save();
    c.translate(x, y);
    c.fillStyle = 'rgba(200, 25, 15, 0.88)';
    c.beginPath();
    const pts = 14;
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const rr = tam * rand(0.7, 1.15);
      const px = Math.cos(a) * rr;
      const py = Math.sin(a) * rr;
      if (i === 0) c.moveTo(px, py);
      else c.lineTo(px, py);
    }
    c.closePath();
    c.fill();

    // miolo mais claro
    c.fillStyle = 'rgba(255, 90, 60, 0.6)';
    c.beginPath();
    c.ellipse(0, 0, tam * 0.55, tam * 0.45, rand(0, 3), 0, Math.PI * 2);
    c.fill();

    // sementes
    c.fillStyle = 'rgba(255, 230, 150, 0.9)';
    for (let i = 0; i < 6; i++) {
      c.beginPath();
      c.ellipse(rand(-tam * 0.5, tam * 0.5), rand(-tam * 0.5, tam * 0.5),
        tam * 0.07, tam * 0.04, rand(0, 3), 0, Math.PI * 2);
      c.fill();
    }

    // respingos ao redor
    c.fillStyle = 'rgba(200, 25, 15, 0.85)';
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2);
      const d = tam * rand(1.1, 2.2);
      c.beginPath();
      c.arc(Math.cos(a) * d, Math.sin(a) * d, tam * rand(0.04, 0.16), 0, Math.PI * 2);
      c.fill();
    }
    c.restore();
  }

  // ---------- Impacto ----------
  function impacto(x, y, tam) {
    desenharMancha(mctx, x, y, tam);

    // respingos voando
    for (let i = 0; i < 22; i++) {
      const a = rand(0, Math.PI * 2);
      const v = rand(2, 9);
      gotas.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 2,
        r: rand(2, 6),
        vida: 1
      });
    }

    // suco escorrendo
    const n = 2 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) {
      escorrendo.push({
        x: x + rand(-tam * 0.6, tam * 0.6),
        y: y + rand(0, tam * 0.3),
        larg: rand(3, 7),
        vel: rand(0.6, 1.8),
        restante: rand(40, 160)
      });
    }
  }

  // ---------- Lançar tomate ----------
  function lancar(alvoX, alvoY) {
    if (fase) return; // não joga tomate durante a limpeza
    contarTomate();
    // começa em um lado/baixo da tela
    const lado = Math.random();
    let sx, sy;
    if (lado < 0.33) { sx = -60; sy = H * rand(0.6, 1); }
    else if (lado < 0.66) { sx = W + 60; sy = H * rand(0.6, 1); }
    else { sx = W * rand(0.2, 0.8); sy = H + 60; }

    voando.push({
      sx, sy, tx: alvoX, ty: alvoY,
      t: 0,
      dur: rand(280, 420), // ms
      arco: rand(120, 260),
      rot: rand(0, 6),
      vrot: rand(-0.4, 0.4),
      r0: 34,
      tam: rand(26, 46),
      inicio: performance.now()
    });
  }

  function aoToque(e) {
    e.preventDefault();
    if (e.touches) {
      for (let i = 0; i < e.changedTouches.length; i++) {
        lancar(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      }
    } else {
      lancar(e.clientX, e.clientY);
    }
  }
  cena.addEventListener('mousedown', aoToque);
  cena.addEventListener('touchstart', aoToque, { passive: false });
  document.addEventListener('contextmenu', e => e.preventDefault());

  // ---------- Placar de tomates ----------
  // Para ativar o contador ONLINE: crie um workspace gratuito em counterapi.dev
  // e coloque o nome dele aqui. Sem isso, só o contador local funciona.
  const CONTADOR_WORKSPACE = 'riquelme-ferreiras-team-6272';
  const CONTADOR_NOME = 'tomates-jogados';
  const CHAVE_LOCAL = 'tomates_meus';

  const elMeus = document.getElementById('tomatesMeus');
  const elTodos = document.getElementById('tomatesTodos');

  // Contador local (salvo no navegador desta pessoa)
  let meus = 0;
  try { meus = parseInt(localStorage.getItem(CHAVE_LOCAL), 10) || 0; } catch (e) {}
  elMeus.textContent = meus.toLocaleString('pt-BR');

  // Contador online (todos os visitantes) — a biblioteca é carregada sem travar a página
  const onlineAtivo = CONTADOR_WORKSPACE !== 'riquelme-ferreiras-team-6272';
  let clienteGlobal = null;

  let pendentes = 0;
  let enviando = false;

  function valorDe(r) {
    if (r == null) return null;
    const cand = [r.value, r.data && r.data.up_count, r.data && r.data.value, r.count];
    for (let i = 0; i < cand.length; i++) if (cand[i] != null) return cand[i];
    return null;
  }
  function mostrarTodos(v) {
    if (v != null && !isNaN(Number(v))) elTodos.textContent = Number(v).toLocaleString('pt-BR');
  }

  async function enviarPendentes() {
    if (enviando || !clienteGlobal) return;
    enviando = true;
    while (pendentes > 0) {
      try {
        const r = await clienteGlobal.up(CONTADOR_NOME);
        pendentes--;
        mostrarTodos(valorDe(r));
      } catch (e) {
        console.warn('Contador online indisponível:', e);
        break; // tenta de novo no próximo tomate ou na próxima atualização
      }
    }
    enviando = false;
  }

  async function atualizarTodos() {
    if (!clienteGlobal || enviando) return;
    try {
      const r = await clienteGlobal.get(CONTADOR_NOME);
      mostrarTodos(valorDe(r));
    } catch (e) {
      // contador ainda não existe (nenhum tomate jogado) ou serviço fora do ar
      if (e && e.status === 404) elTodos.textContent = '0';
    }
  }

  function iniciarOnline() {
    try {
      if (typeof Counter !== 'undefined') {
        clienteGlobal = new Counter({ workspace: CONTADOR_WORKSPACE, timeout: 8000 });
      }
    } catch (e) { clienteGlobal = null; }

    if (clienteGlobal) {
      atualizarTodos();
      if (pendentes > 0) enviarPendentes();
      setInterval(() => (pendentes > 0 ? enviarPendentes() : atualizarTodos()), 30000);
    } else {
      elTodos.textContent = '—';
    }
  }

  if (onlineAtivo) {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/counterapi/dist/counter.browser.min.js';
    sc.async = true;
    sc.onload = iniciarOnline;
    sc.onerror = function () { elTodos.textContent = '—'; };
    document.head.appendChild(sc);
  } else {
    elTodos.textContent = '—';
  }

  function contarTomate() {
    meus++;
    elMeus.textContent = meus.toLocaleString('pt-BR');
    try { localStorage.setItem(CHAVE_LOCAL, String(meus)); } catch (e) {}
    if (onlineAtivo) {
      if (pendentes < 200) pendentes++;
      enviarPendentes(); // se a biblioteca ainda não carregou, envia quando carregar
    }
  }

  // ---------- Limpeza: spray de água + rodo ----------
  const btn = document.getElementById('btnLimpar');
  const spray = { inicio: 0, dur: 2800, gotas: [] };
  const rodo = { inicio: 0, dur: 2400, y: 0 };

  btn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (fase) return;
    fase = 'spray';
    spray.inicio = performance.now();
    spray.gotas.length = 0;
    btn.disabled = true;
    btn.textContent = '💦 Limpando…';
  });

  function sprayX(t) {
    // vai e volta pela largura da tela
    return W * (0.1 + 0.8 * (0.5 - 0.5 * Math.cos(t * Math.PI * 3)));
  }

  function desenharSpray(x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(Math.sin(t * 40) * 0.04);
    // corpo
    ctx.fillStyle = '#3b8fd6';
    ctx.beginPath(); ctx.roundRect(-16, -70, 32, 60, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.roundRect(-11, -64, 6, 48, 3); ctx.fill();
    // cabeça
    ctx.fillStyle = '#e8e8e8';
    ctx.beginPath(); ctx.roundRect(-22, -16, 44, 20, 6); ctx.fill();
    // gatilho
    ctx.fillStyle = '#c9c9c9';
    ctx.beginPath(); ctx.roundRect(18, -14, 12, 22, 4); ctx.fill();
    // bico
    ctx.fillStyle = '#444';
    ctx.beginPath(); ctx.roundRect(-6, 2, 12, 12, 3); ctx.fill();
    ctx.restore();
  }

  function atualizarSpray(agora) {
    const t = (agora - spray.inicio) / spray.dur;
    if (t >= 1) {
      fase = 'rodo';
      rodo.inicio = agora;
      escorrendo.length = 0;
      spray.gotas.length = 0;
      return;
    }
    const bx = sprayX(t);
    const by = 90;

    // novas gotas em leque
    for (let i = 0; i < 12; i++) {
      const ang = Math.PI / 2 + rand(-0.6, 0.6);
      const v = rand(7, 14);
      spray.gotas.push({
        x: bx + rand(-4, 4), y: by + 14,
        vx: Math.cos(ang) * v, vy: Math.sin(ang) * v,
        alvoY: rand(H * 0.12, H * 0.98),
        r: rand(1.5, 3.2)
      });
    }

    // a água dilui as manchas aos poucos
    mctx.save();
    mctx.globalCompositeOperation = 'destination-out';
    mctx.fillStyle = 'rgba(0,0,0,0.03)';
    mctx.fillRect(0, 0, W, H);
    mctx.restore();

    // gotas em voo / pousando na camada de água
    for (let i = spray.gotas.length - 1; i >= 0; i--) {
      const g = spray.gotas[i];
      g.x += g.vx;
      g.y += g.vy;
      if (g.y >= g.alvoY) {
        actx.fillStyle = 'rgba(170, 215, 255, 0.28)';
        actx.beginPath();
        actx.arc(g.x, g.y, g.r * rand(1.5, 3.5), 0, Math.PI * 2);
        actx.fill();
        spray.gotas.splice(i, 1);
        continue;
      }
      ctx.fillStyle = 'rgba(210, 235, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
      ctx.fill();
    }

    desenharSpray(bx, by, t);
  }

  function atualizarRodo(agora) {
    const t = Math.min(1, (agora - rodo.inicio) / rodo.dur);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const y = -30 + e * (H + 60);

    // tudo acima da lâmina é limpo
    mctx.clearRect(0, 0, W, Math.max(0, y + 6));
    actx.clearRect(0, 0, W, Math.max(0, y + 6));

    // água empurrada à frente da lâmina
    ctx.fillStyle = 'rgba(170, 215, 255, 0.55)';
    ctx.fillRect(0, y + 6, W, 9);

    // armação, borracha e cabo
    ctx.fillStyle = '#6b6b6b';
    ctx.fillRect(0, y - 14, W, 14);
    ctx.fillStyle = '#151515';
    ctx.fillRect(0, y, W, 6);
    ctx.fillStyle = '#8a8a8a';
    ctx.fillRect(W / 2 - 40, y - 24, 80, 12);
    ctx.fillStyle = '#e0a030';
    ctx.beginPath(); ctx.roundRect(W / 2 - 11, y - 150, 22, 130, 9); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.roundRect(W / 2 - 6, y - 142, 4, 110, 2); ctx.fill();

    if (t >= 1) {
      mctx.clearRect(0, 0, W, H);
      actx.clearRect(0, 0, W, H);
      escorrendo.length = 0;
      gotas.length = 0;
      fase = null;
      btn.disabled = false;
      btn.textContent = '🧽 Limpar';
    }
  }

  function limpeza(agora) {
    if (fase === 'spray') atualizarSpray(agora);
    else if (fase === 'rodo') atualizarRodo(agora);
  }

  // ---------- Loop ----------
  function loop(agora) {
    ctx.clearRect(0, 0, W, H);

    // manchas acumuladas
    ctx.drawImage(manchas, 0, 0, W, H);
    ctx.drawImage(agua, 0, 0, W, H);

    // sucos escorrendo (desenhados direto na camada permanente)
    for (let i = escorrendo.length - 1; i >= 0; i--) {
      const s = escorrendo[i];
      mctx.fillStyle = 'rgba(190, 20, 12, 0.85)';
      mctx.beginPath();
      mctx.ellipse(s.x, s.y, s.larg / 2, s.vel + 0.5, 0, 0, Math.PI * 2);
      mctx.fill();
      s.y += s.vel;
      s.restante -= s.vel;
      s.vel *= 0.995;
      if (s.restante <= 0) {
        mctx.beginPath();
        mctx.arc(s.x, s.y, s.larg * 0.7, 0, Math.PI * 2);
        mctx.fill();
        escorrendo.splice(i, 1);
      }
    }

    // tomates voando
    for (let i = voando.length - 1; i >= 0; i--) {
      const v = voando[i];
      const p = Math.min(1, (agora - v.inicio) / v.dur);
      const x = v.sx + (v.tx - v.sx) * p;
      const y = v.sy + (v.ty - v.sy) * p - Math.sin(p * Math.PI) * v.arco;
      const escala = 1 - p * 0.35; // fica "menor" ao se afastar
      v.rot += v.vrot;
      desenharTomate(ctx, x, y, v.r0 * escala, v.rot);

      if (p >= 1) {
        impacto(v.tx, v.ty, v.tam);
        voando.splice(i, 1);
      }
    }

    // respingos
    for (let i = gotas.length - 1; i >= 0; i--) {
      const g = gotas[i];
      g.x += g.vx;
      g.y += g.vy;
      g.vy += 0.45;
      g.vida -= 0.035;
      if (g.vida <= 0) { gotas.splice(i, 1); continue; }
      ctx.fillStyle = `rgba(210, 30, 20, ${g.vida})`;
      ctx.beginPath();
      ctx.arc(g.x, g.y, g.r * g.vida, 0, Math.PI * 2);
      ctx.fill();
    }

    try {
      limpeza(agora);
    } catch (err) {
      // um erro na limpeza não pode travar o site inteiro
      console.error(err);
      fase = null;
      btn.disabled = false;
      btn.textContent = '🧽 Limpar';
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
