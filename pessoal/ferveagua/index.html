<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FerveÁgua™ — (Patente pendente)</title>
<style>
:root{--bg:#fdf3e3;--fg:#2b1d12;--card:#fff8ec;--ac:#e8541e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1410;--fg:#f6e8d4;--card:#2a1e17;--ac:#ff7a3d}}
:root[data-theme="dark"]{--bg:#1c1410;--fg:#f6e8d4;--card:#2a1e17;--ac:#ff7a3d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Trebuchet MS',system-ui,sans-serif;text-align:center;overflow-x:hidden}
h1{margin:18px 10px 0;font-size:clamp(1.6rem,6vw,2.6rem)}
.sub{opacity:.7;margin:4px 10px 0}
#stage{position:relative;width:min(340px,92vw);height:320px;margin:10px auto 0}
#pot{position:absolute;left:50%;bottom:50px;width:240px;height:150px;transform:translateX(-50%);background:#8d949c;border-radius:6px 6px 40px 40px;overflow:hidden;box-shadow:inset 0 0 0 4px #5f656c;transition:background .3s}
#water{position:absolute;left:0;right:0;bottom:0;height:75%;background:#3aa0ff}
#pot:before,#pot:after{content:"";position:absolute;top:30px;width:26px;height:10px;background:#5f656c;border-radius:5px;z-index:2}
.b{position:absolute;bottom:0;border-radius:50%;background:rgba(255,255,255,.7);animation:up linear forwards}
@keyframes up{to{transform:translateY(-120px);opacity:0}}
.s{position:absolute;bottom:200px;font-size:26px;opacity:.6;animation:st 2.2s ease-out forwards;pointer-events:none}
@keyframes st{to{transform:translateY(-90px) scale(1.8);opacity:0}}
#stove{position:absolute;left:50%;bottom:0;width:280px;height:54px;transform:translateX(-50%);background:#3b3b3f;border-radius:10px;display:flex;justify-content:center;gap:6px;padding-top:2px}
.f{font-size:34px;line-height:1;transition:transform .2s}
.card{background:var(--card);border-radius:14px;padding:14px;margin:12px auto;width:min(420px,92vw);text-align:left}
.bar{height:22px;border-radius:11px;background:#0002;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#3aa0ff,#ffb02e,#e8541e)}
.row{display:flex;justify-content:space-between;gap:8px;margin-top:6px}
label{display:block;margin-top:8px;font-size:.9rem}
input[type=range]{width:100%}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:8px 14px;font-size:1rem;cursor:pointer;margin-right:4px}
button.off{opacity:.45}
#msg{min-height:1.4em;font-weight:bold;margin:8px 0 0}
#win{display:none;position:fixed;inset:0;background:#000a;z-index:9;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-size:1.2rem;gap:12px;padding:20px}
#win h2{font-size:clamp(2rem,10vw,4rem);margin:0}
</style>
</head>
<body>
<h1>FerveÁgua™</h1>
<p class="sub">1 litro de água, uma boca de fogão, você sabe oque fazer.</p>
<div id="stage">
  <div id="pot"><div id="water"></div></div>
  <div id="stove"></div>
</div>
<div class="card">
  <div class="bar"><div id="fill"></div></div>
  <div class="row"><span> Panela: <b id="tp">22.0</b> °C</span><span> Água: <b id="tw">22.0</b> °C</span></div>
  <div class="row"><span> Tempo: <b id="clk">00:00</b></span><span>Ferve a <b id="bpv">100.0</b> °C</span></div>
  <p id="msg">Gire o botão do fogo e espere. Sem pressa.</p>
</div>
<div class="card">
  <label> Fogo: <b id="fv">0</b>% (100% ≈ 1 kW úteis, de uma boca de ~2,5 kW)<input id="flame" type="range" min="0" max="100" value="0"></label>
  <label> Altitude: <b id="av">0</b> m<input id="alt" type="range" min="0" max="8848" value="0" step="50"></label>
  <label> Velocidade do tempo:</label>
  <div id="spd"><button data-s="1">1× (real)</button><button data-s="10">10×</button><button data-s="60">60×</button></div>
  <p style="margin:10px 0 0">Águas fervidas: <b id="cnt">0</b></p>
</div>
<div id="win"><h2>🎉 FERVEU! 🎉</h2><div id="wt"></div><button id="again">Ferver outra</button><button id="keep">Continuar fervendo</button></div>
<script>
const $=id=>document.getElementById(id);
const stove=$('stove');for(let i=0;i<5;i++){const s=document.createElement('span');s.className='f';s.textContent='🔥';s.style.opacity=0;stove.appendChild(s)}
const flames=[...stove.children];
// Parâmetros físicos
const AMB=22, C_POT=400, CW=4186, G=100, LOSS=1.5, P_MAX=1000, LV=2.26e6, M0=1.0;
let Tp,Tw,m,t,boiled,speed=1,count=0,last=performance.now();
function reset(){Tp=AMB;Tw=AMB;m=M0;t=0;boiled=false;$('win').style.display='none'}
reset();
// ponto de ebulição por altitude (barométrica + Antoine)
function bp(){const h=+$('alt').value;const P=101.325*Math.pow(1-2.25577e-5*h,5.25588)*7.50062;
return 1730.63/(8.07131-Math.log10(P))-233.426}
// áudio
let ac,gain;function startAudio(){if(ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();
const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=buf.getChannelData(0);
for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=500;
gain=ac.createGain();gain.gain.value=0;src.connect(f).connect(gain).connect(ac.destination);src.start()}catch(e){}}
document.addEventListener('pointerdown',startAudio);
$('flame').oninput=e=>$('fv').textContent=e.target.value;
$('alt').oninput=e=>$('av').textContent=e.target.value;
document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;
document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('off',x!==b))});
document.querySelector('#spd button').click();
function step(dt,b,fl){
 const qIn=fl*P_MAX;
 const qPW=G*(Tp-Tw);
 Tp+=(qIn-qPW-LOSS*0.5*(Tp-AMB))*dt/C_POT;
 const mc=m*CW;
 Tw+=(qPW-LOSS*0.5*(Tw-AMB))*dt/mc;
 if(Tw>=b){ // energia excedente vira vapor
  const ex=(Tw-b)*mc; m=Math.max(.05,m-ex/LV); Tw=b;
  if(!boiled){boiled=true;count++;$('cnt').textContent=count;
   const mm=Math.floor(t/60),ss=Math.floor(t%60);
   $('wt').textContent=`Levou ${mm} min ${ss} s (tempo simulado) a ${b.toFixed(1)} °C.`;$('win').style.display='flex'}
 }
 t+=dt}
function bubble(big){const e=document.createElement('div');e.className='b';const sz=(big?5:2)+Math.random()*(big?10:4);
e.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*95}%;animation-duration:${.6+Math.random()}s`;
$('water').appendChild(e);setTimeout(()=>e.remove(),1700)}
function steam(){const s=document.createElement('div');s.className='s';s.textContent='☁️';
s.style.left=(60+Math.random()*180)+'px';$('stage').appendChild(s);setTimeout(()=>s.remove(),2300)}
function loop(now){const real=Math.min((now-last)/1000,.2);last=now;
 const b=bp(),fl=$('flame').value/100;
 let sim=real*speed;while(sim>0){const d=Math.min(.5,sim);step(d,b,fl);sim-=d}
 flames.forEach((f,i)=>{f.style.opacity=fl>i/5?1:0;f.style.transform=`scale(${.6+fl*.8})`});
 const r=Math.max(0,Math.min(1,(Tw-AMB)/(b-AMB)));
 $('fill').style.width=r*100+'%';
 $('tp').textContent=Tp.toFixed(1);$('tw').textContent=Tw.toFixed(1);$('bpv').textContent=b.toFixed(1);
 $('clk').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
 $('water').style.height=(75*m/M0)+'%';
 $('water').style.background=`hsl(210,80%,${58-r*8}%)`;
 $('pot').style.background=`hsl(${Tp>150?15:210},${Math.min(60,Math.max(0,(Tp-100)*.5))}%,${55-Math.min(15,Math.max(0,Tp-100)*.3)}%)`;
 let msg;
 if(fl===0&&Tw<AMB+1)msg='Fogo apagado.';
 else if(boiled&&Tw>=b-.01)msg='A água está virando vapor.'+Math.round(m*1000)+' mL restantes).';
 else if(Tp-Tw>15)msg='A panela está esquentando antes da água...';
 else if(r<.5)msg='Isso é normal.';
 else if(r<.85)msg='Comecou a borbulhar';
 else msg='Quase la...';
 $('msg').textContent=msg;
 const bub=Math.max(0,(Tw-45)/(b-45));
 if(Math.random()<bub*(boiled?1:.25)*Math.min(1,real*60/ (speed>1?4:1)))bubble(boiled);
 if(Tw>70&&Math.random()<(boiled?.12:.03))steam();
 if(gain)gain.gain.value=boiled&&Tw>=b-.01?.3:Math.max(0,Math.min(.1,(Tw-70)/(b-70)*.1));
 requestAnimationFrame(loop)}
$('again').onclick=()=>{reset();$('flame').value=0;$('fv').textContent=0};
$('keep').onclick=()=>$('win').style.display='none';
requestAnimationFrame(loop);
</script>
</body>
</html>
