<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrija o código C</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--card:#fff;--mut:#667085;--bd:#d9dee7;--ok:#16a34a;--bad:#dc2626;--badbg:rgba(220,38,38,.15);--acc:#2563eb;--code:#0f172a;--codefg:#e2e8f0;--gut:#1e293b;--gutfg:#64748b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e6eaf2;--card:#141b2d;--mut:#94a3b8;--bd:#26304a;--code:#070b16;--gut:#0e1424}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e6eaf2;--card:#141b2d;--mut:#94a3b8;--bd:#26304a;--code:#070b16;--gut:#0e1424}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.4rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.used{background:var(--bad)}
.tag{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--mut)}
.ed{display:flex;background:var(--code);border-radius:10px;overflow:hidden;border:1px solid var(--bd);height:380px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.gut{background:var(--gut);color:var(--gutfg);padding:12px 8px;text-align:right;overflow:hidden;user-select:none;min-width:2ch;white-space:pre}
textarea{flex:1;background:transparent;color:var(--codefg);border:0;outline:0;resize:none;padding:12px;font:inherit;white-space:pre;overflow:auto;tab-size:4}
.res{background:var(--code);color:var(--codefg);border-radius:10px;border:1px solid var(--bd);overflow-x:auto;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 0}
.ln{display:flex;padding:0 12px 0 0;white-space:pre}
.ln b{font-weight:400;color:var(--gutfg);width:3.2ch;text-align:right;margin-right:12px;flex:none}
.ln.err{background:var(--badbg);box-shadow:inset 3px 0 0 var(--bad)}
.ln.err span{text-decoration:underline wavy var(--bad);text-underline-offset:3px}
.fix{display:block;margin:0 0 4px 0;padding:4px 12px 6px 4.6em;font:13px/1.45 system-ui,sans-serif;color:#fca5a5;white-space:normal}
.fix code{color:#86efac;font-family:ui-monospace,Menlo,Consolas,monospace}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--acc);color:#fff}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.95rem;display:none}
.msg.ok{display:block;background:rgba(22,163,74,.15);color:var(--ok);border:1px solid var(--ok)}
.msg.bad{display:block;background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.msg.info{display:block;background:var(--card);border:1px solid var(--bd)}
</style>
</head>
<body>
<main>
  <h1>🛠️ Corrija o código C</h1>
  <p class="sub">O código abaixo tem erros de sintaxe. Edite direto na tela e clique em <b>Verificar</b>. Você tem 3 tentativas.</p>
  <div class="bar">
    <span class="tag" id="tag"></span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="ed" id="ed"><div class="gut" id="gut"></div><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div>
  <div class="res" id="res" style="display:none"></div>
  <div class="msg" id="msg"></div>
  <div class="btns">
    <button id="check">Verificar</button>
    <button class="sec" id="next">Novo desafio</button>
  </div>
</main>

<!-- 1. Carrega os dados dos desafios -->
<script src="desafios.js"></script>

<!-- 2. Lógica da aplicação -->
<script>
const $=id=>document.getElementById(id);
const ta=$('ta'),gut=$('gut'),msg=$('msg');
let cur,tries,done,last=-1;
const norm=s=>s.replace(/\s+/g,'');
const lines=s=>s.replace(/\r/g,'').split('\n');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function dots(){$('dots').innerHTML='Tentativas: '+[0,1,2].map(i=>`<span class="dot ${i<tries?'used':''}"></span>`).join('')}
function nums(){gut.textContent=lines(ta.value).map((_,i)=>i+1).join('\n')}
function show(t,c){msg.className='msg '+c;msg.innerHTML=t}
function start(){
  let i;do{i=Math.floor(Math.random()*CH.length)}while(i===last&&CH.length>1);
  last=i;cur=CH[i];tries=0;done=false;
  $('tag').textContent='Desafio com erro(s) de sintaxe';
  ta.value=cur.broken;ta.disabled=false;
  $('ed').style.display='flex';$('res').style.display='none';
  $('check').disabled=false;msg.className='msg';dots();nums();
}
function wrongLines(){
  const u=lines(ta.value),f=lines(cur.fixed);
  if(u.length!==f.length)return null;
  return f.map((l,i)=>norm(l)===norm(u[i])?-1:i).filter(i=>i>=0);
}
function reveal(){
  const b=lines(cur.broken),f=lines(cur.fixed);
  let h='';
  b.forEach((l,i)=>{
    const m=cur.m[i+1];
    h+=`<div class="ln${m?' err':''}"><b>${i+1}</b><span>${esc(l)||' '}</span></div>`;
    if(m)h+=`<div class="fix">❌ ${esc(m)}<br>Correto: <code>${esc(f[i].trim())}</code></div>`;
  });
  $('res').innerHTML=h;$('ed').style.display='none';$('res').style.display='block';
}
$('check').onclick=()=>{
  if(done)return;
  tries++;dots();
  const ok=norm(ta.value)===norm(cur.fixed);
  if(ok){done=true;ta.disabled=true;$('check').disabled=true;
    show(`✅ Parabéns! Você corrigiu tudo em ${tries} tentativa${tries>1?'s':''}.`,'ok');return}
  if(tries>=3){done=true;$('check').disabled=true;reveal();
    show('❌ Suas 3 tentativas acabaram. Os erros estão destacados em vermelho, com a correção.','bad');return}
  const w=wrongLines();
  const extra=w?` Ainda há <b>${w.length}</b> linha(s) com problema.`:' O código ainda não está correto.';
  show(`⚠️ Não foi dessa vez.${extra} Restam ${3-tries} tentativa(s).`,'info');
};
$('next').onclick=start;
ta.addEventListener('input',nums);
ta.addEventListener('scroll',()=>{gut.scrollTop=ta.scrollTop});
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;
    ta.setRangeText('    ',s,ta.selectionEnd,'end');nums()}
});
start();
</script>
</body>
</html>
