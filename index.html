<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lobby do Meu GitHub</title>
    <style>
        /* Estilos básicos para deixar a página bonita */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
        }
        
        /* Estilo do botão */
        .botao-projetos {
            display: inline-block;
            padding: 15px 30px;
            font-size: 18px;
            color: white;
            background-color: #007bff; /* Cor azul */
            text-decoration: none; /* Tira o sublinhado do link */
            border-radius: 8px;
            transition: background-color 0.3s ease;
            margin-top: 20px;
        }

        /* Efeito quando passa o mouse por cima */
        .botao-projetos:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Olá, eu sou o [Seu Nome]!</h1>
    <p>Bem-vindo ao meu lobby.</p>

    <!-- O link que funciona como botão. Ele aponta para a pasta "programas" -->
    <a href="./programas/" class="botao-projetos">Ver meus Programas</a>

</body>
</html>
