<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Corrija o código C</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c2330;--card:#fff;--mut:#667085;--bd:#d9dee7;--ok:#16a34a;--bad:#dc2626;--hint:#f59e0b;--badbg:rgba(220,38,38,.15);--acc:#2563eb;--code:#0f172a;--codefg:#e2e8f0;--gut:#1e293b;--gutfg:#64748b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--fg:#e6eaf2;--card:#141b2d;--mut:#94a3b8;--bd:#26304a;--code:#070b16;--gut:#0e1424}}
:root[data-theme="dark"]{--bg:#0b1020;--fg:#e6eaf2;--card:#141b2d;--mut:#94a3b8;--bd:#26304a;--code:#070b16;--gut:#0e1424}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.ctl{display:flex;gap:8px;align-items:center}
h1{font-size:1.4rem;margin:0}
.ic{background:var(--card);color:var(--fg);border:1px solid var(--bd);padding:5px 10px;border-radius:999px;font-size:.85rem}
.sw{position:relative;width:54px;height:28px;padding:0 7px;border-radius:999px;background:var(--card);border:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;font-size:13px}
.sw .i{position:relative;z-index:1;line-height:1}
.sw .knob{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--acc);transition:transform .2s}
.sw[aria-checked="true"] .knob{transform:translateX(26px)}
p.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.dots{display:flex;gap:6px;align-items:center;font-size:.9rem;color:var(--mut)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.used{background:var(--bad)}
.dot.hint{background:var(--hint)}
.tag{background:var(--card);border:1px solid var(--bd);border-radius:999px;padding:3px 10px;font-size:.8rem;color:var(--mut)}
.ed{display:flex;background:var(--code);border-radius:10px;overflow:hidden;border:1px solid var(--bd);height:380px;font:14px/22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.gut{background:var(--gut);color:var(--gutfg);padding:12px 8px;text-align:right;overflow:hidden;user-select:none;min-width:2ch;white-space:pre}
.tw{flex:1;position:relative;min-width:0}
.hl{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.hl>div{padding-top:12px;will-change:transform}
.hl i,.gut i{display:block;height:var(--lh,22px);line-height:var(--lh,22px);overflow:hidden}
.stage{position:relative;overflow:hidden;border-radius:10px}
#scare{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.mask{position:absolute;inset:0;background:#000;border-radius:10px;display:none;align-items:center;justify-content:center;z-index:5;overflow:hidden}
.mask.on{display:flex;animation:pop .12s ease-out}
.mask img{height:100%;max-width:100%;object-fit:contain;image-rendering:pixelated}
@keyframes pop{from{transform:scale(1.15)}to{transform:scale(1)}}
.notes{padding:8px 12px 4px;font:13px/1.5 system-ui,sans-serif;white-space:normal}
.notes div{margin:0 0 8px}
.notes code{color:#86efac;font-family:ui-monospace,Menlo,Consolas,monospace}
.hl i.g{background:rgba(22,163,74,.25);box-shadow:inset 3px 0 0 var(--ok)}
.hl i.o{background:rgba(245,158,11,.28);box-shadow:inset 3px 0 0 var(--hint)}
textarea{position:absolute;inset:0;width:100%;height:100%;box-sizing:border-box;background:transparent;color:var(--codefg);border:0;outline:0;resize:none;padding:12px;font:inherit;white-space:pre;overflow:auto;tab-size:4}
.res{background:var(--code);color:var(--codefg);border-radius:10px;border:1px solid var(--bd);overflow-x:auto;font:14px/22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:6px 0}
.ln{display:flex;height:22px;line-height:22px;padding:0 12px 0 0;white-space:pre}
.ln b{font-weight:400;color:var(--gutfg);width:3.2ch;text-align:right;margin-right:12px;flex:none}
.ln.err{background:var(--badbg);box-shadow:inset 3px 0 0 var(--bad)}
.ln.err span{text-decoration:underline wavy var(--bad);text-underline-offset:3px}
.ln.good{background:rgba(22,163,74,.18);box-shadow:inset 3px 0 0 var(--ok)}
.fix{display:block;margin:0 0 4px 0;padding:4px 12px 6px 4.6em;font:13px/1.45 system-ui,sans-serif;color:#fca5a5;white-space:normal}
.fix.ok{color:#86efac}
.fix code{color:#86efac;font-family:ui-monospace,Menlo,Consolas,monospace}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 18px;cursor:pointer;background:var(--acc);color:#fff}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button.hint{background:var(--hint);color:#1c1300}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:.95rem;display:none}
.msg.ok{display:block;background:rgba(22,163,74,.15);color:var(--ok);border:1px solid var(--ok)}
.msg.bad{display:block;background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.msg.info{display:block;background:var(--card);border:1px solid var(--bd)}
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="h1"></h1><div class="ctl">
    <button class="ic" id="lang" title="Language / Idioma">🌐 <span id="langc">EN</span></button>
    <button class="sw" id="theme" role="switch" aria-checked="false"><span class="i">☀️</span><span class="i">🌙</span><span class="knob"></span></button>
  </div></div>
  <p class="sub" id="sub"></p>
  <div class="bar">
    <span class="tag" id="tag"></span>
    <div class="dots" id="dots"></div>
  </div>
  <div class="stage"><div class="ed" id="ed">
    <div class="gut" id="gut"></div>
    <div class="tw"><div class="hl" id="hl"><div></div></div><textarea id="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off"></textarea></div>
  </div>

<!-- 1. Carrega os dados dos desafios -->
<script src="desafios.js"></script>

<!-- 2. Lógica da aplicação -->
<script>
const $=id=>document.getElementById(id);
const ta=$('ta'),gut=$('gut'),hl=$('hl'),msg=$('msg');
let cur,used,done,last=-1,marks={},mcount=0,hintIdx=null,revealed=false,curMsg=null;
const sv=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},ld=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
let lang=ld('lang')==='en'?'en':'pt',theme=ld('theme');
if(theme!=='dark'&&theme!=='light')theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
const T={
pt:{h1:'🛠️ Corrija o código C',sub:'O código abaixo tem erros de sintaxe. <span id="scare">Edite</span> direto na tela e clique em <b>Verificar</b>. Você tem 3 tentativas; a dica custa 1 delas.',tag:'Desafio com erro(s) de sintaxe',att:'Tentativas:',check:'Verificar',hint:'💡 Dica (-1 tentativa)',hintT:'Destaca uma linha errada e consome 1 tentativa',next:'Novo desafio',themeL:'Tema claro/escuro',
ok:n=>`✅ Parabéns! Você corrigiu tudo usando ${n} tentativa${n>1?'s':''}.`,
fail:(g,t)=>`❌ Suas 3 tentativas acabaram. Você corrigiu ${g} de ${t} erro(s). Verde = corrigido, vermelho = errado.`,
part:(w,l)=>`⚠️ Não foi dessa vez.${w===null?' O código ainda não está correto.':` Ainda há <b>${w}</b> linha(s) com problema. As linhas já corrigidas ficaram em verde.`} Restam ${l} tentativa(s).`,
hm:(n,l)=>`💡 Dica: há um problema na <b>linha ${n}</b> (em laranja). Isso custou 1 tentativa; restam ${l}.`,
line:'Linha',fx:'corrigida.',right:'Correto',chg:'Esta linha estava certa e foi alterada.'},
en:{h1:'🛠️ Fix the C code',sub:'The code below has syntax errors. <span id="scare">Edit</span> it right on the screen and click <b>Check</b>. You have 3 attempts; a hint costs 1 of them.',tag:'Challenge with syntax error(s)',att:'Attempts:',check:'Check',hint:'💡 Hint (-1 attempt)',hintT:'Highlights a wrong line and uses 1 attempt',next:'New challenge',themeL:'Light/dark theme',
ok:n=>`✅ Well done! You fixed everything using ${n} attempt${n>1?'s':''}.`,
fail:(g,t)=>`❌ You ran out of attempts. You fixed ${g} of ${t} error(s). Green = fixed, red = wrong.`,
part:(w,l)=>`⚠️ Not this time.${w===null?' The code is still not correct.':` There ${w===1?'is':'are'} still <b>${w}</b> line(s) with problems. Lines you already fixed are in green.`} ${l} attempt(s) left.`,
hm:(n,l)=>`💡 Hint: there is a problem on <b>line ${n}</b> (in orange). That cost 1 attempt; ${l} left.`,
line:'Line',fx:'fixed.',right:'Correct',chg:'This line was correct and was changed.'}};
const tr=k=>T[lang][k];
const msgOf=k=>((lang==='en'&&cur.en)?cur.en:cur.m)[k]||cur.m[k];

/* Comparação por tokens da linguagem C: "int i=0" == "int  i = 0", mas "inti=0" != "int i=0".
   Espaços dentro de strings continuam importando; comentários são ignorados. */
const TOK=/\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|[A-Za-z_]\w*|\d+\.?\d*[fFlLuU]*|\.\d+|==|!=|<=|>=|&&|\|\||\+\+|--|->|\+=|-=|\*=|\/=|<<|>>|\S/g;
const toks=s=>(s.match(TOK)||[]).filter(t=>!/^\/[\/*]/.test(t)).join('\u0001');
const same=(a,b)=>toks(a)===toks(b);
const lines=s=>s.replace(/\r/g,'').split('\n');
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

function dots(){$('dots').innerHTML=tr('att')+' '+[0,1,2].map(i=>`<span class="dot ${used[i]||''}"></span>`).join('')}
function paint(){
  const n=lines(ta.value).length,box=hl.firstChild;
  box.innerHTML=Array.from({length:n},(_,i)=>`<i class="${marks[i]||''}"></i>`).join('');
  box.style.transform=`translateY(${-ta.scrollTop}px)`;
}
/* mede a altura real de linha do textarea neste navegador e usa a mesma em numeração e destaques */
function calib(){
  const p=ta.cloneNode();p.removeAttribute('id');p.disabled=false;
  p.style.cssText='position:absolute;inset:auto;left:-9999px;top:0;width:200px;height:20px;visibility:hidden';
  ta.parentNode.appendChild(p);
  p.value='x';const a=p.scrollHeight;p.value='x\n'.repeat(10)+'x';const b=p.scrollHeight;p.remove();
  const lh=(b-a)/10;if(lh>8&&lh<60)$('ed').style.setProperty('--lh',lh+'px');
}
function nums(){gut.innerHTML=lines(ta.value).map((_,i)=>`<i>${i+1}</i>`).join('');paint()}
function show(fn,c){curMsg={fn,c};msg.className='msg '+c;msg.innerHTML=fn()}
function upd(){$('check').disabled=done;$('hint').disabled=done||used.length>=2;dots()}

function start(){
  let i;do{i=Math.floor(Math.random()*CH.length)}while(i===last&&CH.length>1);
  last=i;cur=CH[i];used=[];done=false;marks={};hintIdx=null;
  revealed=false;curMsg=null;
  ta.value=cur.broken;ta.disabled=false;mcount=lines(ta.value).length;
  $('ed').style.display='flex';$('res').style.display='none';
  msg.className='msg';upd();nums();
}
function wrongLines(){
  const u=lines(ta.value),f=lines(cur.fixed);
  if(u.length!==f.length)return null;
  return f.map((l,i)=>same(l,u[i])?-1:i).filter(i=>i>=0);
}
// linhas de erro que o usuário já corrigiu ficam verdes; a dica fica laranja
function computeMarks(){
  const u=lines(ta.value),f=lines(cur.fixed),m={};
  if(u.length===f.length)f.forEach((l,i)=>{if(cur.m[i+1]&&same(l,u[i]))m[i]='g'});
  mcount=u.length;
  if(hintIdx!==null&&!m[hintIdx])m[hintIdx]='o';
  return m;
}
function reveal(){
  const u=lines(ta.value),f=lines(cur.fixed),b=lines(cur.broken);
  const eq=u.length===f.length,src=eq?u:b;
  let h='',notes='',good=0;revealed=true;
  src.forEach((l,i)=>{
    const m=cur.m[i+1],ok=eq&&same(f[i],l);let cls='';
    if(m&&ok){good++;cls=' good';notes+=`<div>✅ <b>${tr('line')} ${i+1}:</b> ${tr('fx')} ${esc(msgOf(i+1))}</div>`}
    else if(m||(eq&&!ok)){cls=' err';notes+=`<div>❌ <b>${tr('line')} ${i+1}:</b> ${esc(m?msgOf(i+1):tr('chg'))}<br>${tr('right')}: <code>${esc(f[i].trim())}</code></div>`}
    h+=`<div class="ln${cls}"><b>${i+1}</b><span>${esc(l)||' '}</span></div>`;
  });
  $('res').innerHTML=h+`<div class="notes">${notes}</div>`;
  $('ed').style.display='none';$('res').style.display='block';
  return good;
}
$('check').onclick=()=>{
  if(done)return;
  used.push('used');
  if(toks(ta.value)===toks(cur.fixed)){
    done=true;ta.disabled=true;hintIdx=null;marks={};
    if(lines(ta.value).length===lines(cur.fixed).length)Object.keys(cur.m).forEach(k=>marks[k-1]='g');
    upd();paint();const n=used.length;
    show(()=>tr('ok')(n),'ok');return}
  if(used.length>=3){
    done=true;upd();
    const g=reveal(),t=Object.keys(cur.m).length;
    show(()=>tr('fail')(g,t),'bad');return}
  marks=computeMarks();upd();paint();
  const w=wrongLines(),c=w?w.length:null,l=3-used.length;
  show(()=>tr('part')(c,l),'info');
};
$('hint').onclick=()=>{
  if(done||used.length>=2)return;
  const w=wrongLines();
  let idx;
  if(w&&w.length){idx=w.find(i=>cur.m[i+1]);if(idx===undefined)idx=w[0]}
  else idx=Number(Object.keys(cur.m)[0])-1;
  used.push('hint');hintIdx=idx;
  marks=computeMarks();marks[idx]=marks[idx]||'o';
  upd();paint();const l=3-used.length;
  show(()=>tr('hm')(idx+1,l),'info');
};
$('next').onclick=start;
ta.addEventListener('input',()=>{
  if(lines(ta.value).length!==mcount){marks={};hintIdx=null;mcount=lines(ta.value).length}
  nums();
});
ta.addEventListener('scroll',()=>{gut.scrollTop=ta.scrollTop;hl.firstChild.style.transform=`translateY(${-ta.scrollTop}px)`});
ta.addEventListener('keydown',e=>{
  if(e.key==='Tab'){e.preventDefault();const s=ta.selectionStart;
    ta.setRangeText('    ',s,ta.selectionEnd,'end');nums()}
});
$('sub').addEventListener('click',e=>{
  if(e.target.id!=='scare')return;
  const o=$('mask');if(o.classList.contains('on'))return;
  o.classList.add('on');setTimeout(()=>o.classList.remove('on'),3000);
});
function applyTheme(){document.documentElement.dataset.theme=theme;$('theme').setAttribute('aria-checked',theme==='dark')}
function applyLang(){
  document.documentElement.lang=lang==='en'?'en':'pt-BR';
  $('h1').textContent=tr('h1');$('sub').innerHTML=tr('sub');$('tag').textContent=tr('tag');
  $('check').textContent=tr('check');$('hint').textContent=tr('hint');$('hint').title=tr('hintT');$('next').textContent=tr('next');
  $('langc').textContent=lang==='en'?'PT':'EN';$('theme').setAttribute('aria-label',tr('themeL'));
  dots();if(curMsg)msg.innerHTML=curMsg.fn();if(revealed)reveal();
}
$('lang').onclick=()=>{lang=lang==='en'?'pt':'en';sv('lang',lang);applyLang()};
$('theme').onclick=()=>{theme=theme==='dark'?'light':'dark';sv('theme',theme);applyTheme()};
calib();start();applyTheme();applyLang();
</script>
</body>
