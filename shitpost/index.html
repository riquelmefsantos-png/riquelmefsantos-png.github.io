<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prossiga com cautela</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 700px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .lista { display: grid; gap: 15px; margin-top: 20px; }
        .card {
            display: block;
            padding: 20px;
            background: white;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease;
        }
        .card:hover { transform: translateY(-3px); }
        .card h2 { margin: 0 0 5px; color: #007bff; }
        .voltar { color: #007bff; text-decoration: none; }
    </style>
</head>
<body>
    <a class="voltar" href="../">← Voltar ao lobby</a>
    <h1>Entre por sua conta em risco</h1>

    <div class="lista">
        <a class="card" href="./ferveagua/">
            <h2>Ferver água™</h2>
            <p>Um site sobre ferver água (patenteado).</p>
        </a>

</body>
</html>
