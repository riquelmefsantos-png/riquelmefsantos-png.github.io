<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirâmide</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        .cena {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 900px;
        }
        .piramide {
            position: relative;
            width: 240px;
            height: 240px;
            transform-style: preserve-3d;
            animation: girar 8s linear infinite;
        }
        .face {
            position: absolute;
            left: 0;
            top: -28px;              /* base da face alinhada com a base da pirâmide */
            width: 240px;
            height: 268px;           /* altura inclinada do triângulo */
            transform-origin: 50% 100%;
            clip-path: polygon(50% 0, 0 100%, 100% 100%);
            background: #888 url("imagem.jpg") center / cover no-repeat;
        }
        .f1 { transform: rotateY(0deg)   translateZ(120px) rotateX(26.565deg); }
        .f2 { transform: rotateY(90deg)  translateZ(120px) rotateX(26.565deg); }
        .f3 { transform: rotateY(180deg) translateZ(120px) rotateX(26.565deg); }
        .f4 { transform: rotateY(270deg) translateZ(120px) rotateX(26.565deg); }

        @keyframes girar {
            from { transform: rotateX(-15deg) rotateY(0deg); }
            to   { transform: rotateX(-15deg) rotateY(360deg); }
        }
    </style>
</head>
<body>
    <div class="cena">
        <div class="piramide">
            <div class="face f1"></div>
            <div class="face f2"></div>
            <div class="face f3"></div>
            <div class="face f4"></div>
        </div>
    </div>
</body>
</html>
